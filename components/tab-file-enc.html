<div class="panel-grid">
                <!-- LEFT -->
                <div class="panel-col">
                    <!-- DROP ZONE -->
                    <div class="glass-card">
                        <div class="card-header">
                            <div class="card-title-row">
                                <svg class="card-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                                    <path d="M4 4a2 2 0 0 1 2-2h5l5 5v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4z"
                                        stroke="#00FF41" stroke-width="1.5" />
                                    <path d="M11 2v5h5" stroke="#00FF41" stroke-width="1.5" />
                                </svg>
                                <h2 class="card-title">FILE ĐẦU VÀO</h2>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="file-drop-zone" id="file-drop-zone-enc" tabindex="0" role="button"
                                aria-label="Kéo thả file hoặc nhấn để chọn">
                                <input type="file" id="file-input-enc" class="file-input-hidden" aria-hidden="true" />
                                <div class="file-drop-icon" id="file-drop-icon-enc" aria-hidden="true">
                                    <svg viewBox="0 0 48 48" fill="none">
                                        <path d="M24 8v24M14 20l10-12 10 12" stroke="#00FF41" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round" />
                                        <path d="M8 38h32" stroke="#00FF41" stroke-width="2" stroke-linecap="round"
                                            opacity="0.5" />
                                    </svg>
                                </div>
                                <div id="file-drop-text-enc">
                                    <p class="file-drop-main">Kéo thả file vào đây</p>
                                    <p class="file-drop-sub">hoặc <span class="file-drop-link">nhấn để chọn file</span>
                                    </p>
                                </div>
                            </div>
                            <div class="file-selected" id="file-selected-enc" style="display:none; margin-top:.75rem;">
                                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" style="flex-shrink:0">
                                    <path d="M4 4a2 2 0 0 1 2-2h5l5 5v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4z"
                                        stroke="#00FF41" stroke-width="1.5" />
                                    <path d="M11 2v5h5" stroke="#00FF41" stroke-width="1.5" />
                                </svg>
                                <div style="flex:1;min-width:0">
                                    <div class="file-name" id="file-name-enc">—</div>
                                    <div class="file-size" id="file-size-enc">—</div>
                                </div>
                                <button class="text-btn" id="btn-change-file-enc" style="margin-right:.25rem">Đổi
                                    file</button>
                                <button class="icon-btn" id="btn-clear-file-enc" aria-label="Xóa file">
                                    <svg viewBox="0 0 20 20" fill="none">
                                        <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.5"
                                            stroke-linecap="round" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- KEY -->
                    <div class="glass-card">
                        <div class="card-header">
                            <div class="card-title-row">
                                <svg class="card-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                                    <path d="M7 10a3 3 0 1 0 6 0 3 3 0 0 0-6 0zm3-3V4m0 12v-3m6-3h-3M7 10H4"
                                        stroke="#00FF41" stroke-width="1.5" stroke-linecap="round" />
                                </svg>
                                <h2 class="card-title">KEY CONFIG</h2>
                            </div>
                        </div>
                        <div class="card-body key-body">
                            <div class="key-row">
                                <div class="form-group">
                                    <div class="seg-control" role="group" aria-label="Độ dài khóa">
                                        <button class="seg-btn active" data-keylen="128"
                                            id="enc-file-seg-128">AES-128</button>
                                        <button class="seg-btn" data-keylen="192" id="enc-file-seg-192">AES-192</button>
                                        <button class="seg-btn" data-keylen="256" id="enc-file-seg-256">AES-256</button>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group" style="margin-top:1rem">
                                <div class="label-row">
                                    <label for="file-key-enc" class="form-label">Secret Key</label>
                                    <div class="key-actions">
                                        <button class="text-btn" id="btn-gen-key-enc" aria-label="Tạo key ngẫu nhiên">
                                            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                <path
                                                    d="M2 8a6 6 0 0 1 6-6 6 6 0 0 1 4.24 1.76M14 8a6 6 0 0 1-6 6 6 6 0 0 1-4.24-1.76"
                                                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                                                <path d="M11 5.76L14 5l-.76 3" stroke="currentColor" stroke-width="1.5"
                                                    stroke-linecap="round" stroke-linejoin="round" />
                                            </svg>
                                            Tạo key ngẫu nhiên
                                        </button>
                                        <button class="text-btn" id="btn-toggle-file-key-enc" aria-label="Hiện/ẩn key">
                                            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"
                                                    stroke="currentColor" stroke-width="1.5" />
                                                <circle cx="8" cy="8" r="2.5" stroke="currentColor"
                                                    stroke-width="1.5" />
                                            </svg>
                                            Hiện key
                                        </button>
                                    </div>
                                </div>
                                <div class="input-wrapper">
                                    <input type="password" id="file-key-enc" class="cyber-input"
                                        placeholder="Nhập secret key..." autocomplete="off" spellcheck="false"
                                        aria-describedby="key-hint-enc" />
                                    <div class="key-strength" id="key-strength-enc" aria-hidden="true">
                                        <div class="strength-bar"></div>
                                        <div class="strength-bar"></div>
                                        <div class="strength-bar"></div>
                                        <div class="strength-bar"></div>
                                    </div>
                                </div>
                                <p id="key-hint-enc" class="form-hint">AES-128: 16 ký tự · AES-192: 24 ký tự · AES-256:
                                    32 ký tự</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- RIGHT -->
                <div class="panel-col">
                    <div class="file-action-center">
                        <button class="cyber-btn" id="btn-encrypt-file" aria-label="Mã hóa file">
                            <div class="btn-glow" aria-hidden="true"></div>
                            <div class="btn-inner">
                                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path d="M12 1a5 5 0 0 1 5 5v3H7V6a5 5 0 0 1 5-5z" stroke="currentColor"
                                        stroke-width="2" />
                                    <rect x="3" y="9" width="18" height="13" rx="2" stroke="currentColor"
                                        stroke-width="2" />
                                    <circle cx="12" cy="15.5" r="2" fill="currentColor" />
                                </svg>
                                <span class="btn-text">ENCRYPT FILE</span>
                                <div class="btn-loader" aria-hidden="true">
                                    <div class="loader-dot"></div>
                                    <div class="loader-dot"></div>
                                    <div class="loader-dot"></div>
                                </div>
                            </div>
                        </button>
                    </div>

                    <!-- RESULT -->
                    <div class="glass-card output-card">
                        <div class="card-header">
                            <div class="card-title-row">
                                <svg class="card-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                                    <path d="M3 17V11M7 17V7M11 17V3M15 17V9" stroke="#00FF41" stroke-width="1.5"
                                        stroke-linecap="round" />
                                </svg>
                                <h2 class="card-title">KẾT QUẢ MÃ HÓA</h2>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="file-result-area" id="file-result-placeholder-enc">
                                <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
                                    <path d="M24 8v24M14 20l10-12 10 12" stroke="#00FF41" stroke-width="1.5"
                                        stroke-linecap="round" opacity="0.3" />
                                    <path d="M8 38h32" stroke="#00FF41" stroke-width="1.5" stroke-linecap="round"
                                        opacity="0.3" />
                                </svg>
                                <p>Kết quả sẽ hiển thị tại đây</p>
                            </div>
                            <div class="file-result-area file-result-done" id="file-result-done-enc"
                                style="display:none">
                                <div class="file-result-check" aria-hidden="true">
                                    <svg viewBox="0 0 48 48" fill="none">
                                        <circle cx="24" cy="24" r="20" stroke="#00FF41" stroke-width="2" />
                                        <path d="M14 24l7 7 13-14" stroke="#00FF41" stroke-width="2.5"
                                            stroke-linecap="round" stroke-linejoin="round" />
                                    </svg>
                                </div>
                                <p class="file-result-label" id="file-result-label-enc">Thành công!</p>
                                <a class="cyber-download-btn" id="file-download-link-enc" download
                                    aria-label="Tải file">
                                    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                                        <path d="M10 3v10M5 9l5 6 5-6" stroke="currentColor" stroke-width="1.5"
                                            stroke-linecap="round" stroke-linejoin="round" />
                                        <path d="M3 17h14" stroke="currentColor" stroke-width="1.5"
                                            stroke-linecap="round" />
                                    </svg>
                                    <span id="file-download-name-enc">Tải xuống</span>
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- METRICS -->
                    <div class="glass-card metrics-card">
                        <div class="card-body metrics-body">
                            <div class="metric-item"><span class="metric-label">Kích thước đầu vào</span><span
                                    class="metric-val" id="file-metric-in-enc">— bytes</span></div>
                            <div class="metric-item"><span class="metric-label">Kích thước đầu ra</span><span
                                    class="metric-val" id="file-metric-out-enc">— bytes</span></div>
                            <div class="metric-item"><span class="metric-label">Thời gian xử lý</span><span
                                    class="metric-val" id="file-metric-time-enc">— ns</span></div>
                            <div class="metric-item"><span class="metric-label">Số khối AES (16B)</span><span
                                    class="metric-val" id="file-metric-blocks-enc">—</span></div>
                        </div>
                    </div>
                </div>
            </div>
