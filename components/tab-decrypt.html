<div class="panel-grid">

                <!-- LEFT: CIPHER INPUT -->
                <div class="panel-col">
                    <div class="glass-card">
                        <div class="card-header">
                            <div class="card-title-row">
                                <svg class="card-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                                    <rect x="3" y="3" width="14" height="14" rx="2" stroke="#00FF41"
                                        stroke-width="1.5" />
                                    <path d="M7 8h6M7 12h4" stroke="#00FF41" stroke-width="1.5"
                                        stroke-linecap="round" />
                                </svg>
                                <h2 class="card-title">CIPHER INPUT (HEX)</h2>
                            </div>
                            <div class="char-count" id="char-count-decrypt" aria-live="polite">0 ký tự</div>
                        </div>
                        <div class="card-body">
                            <label for="ciphertext" class="sr-only">Nhập ciphertext dạng HEX cần giải mã</label>
                            <textarea id="ciphertext" class="cyber-textarea hex-input"
                                placeholder="Nhập ciphertext dạng HEX (ví dụ: 3A 5F 8C ...)..." rows="8"
                                spellcheck="false" aria-describedby="char-count-decrypt"></textarea>
                            <div class="textarea-actions">
                                <button class="icon-btn" id="btn-paste-cipher" title="Dán từ clipboard"
                                    aria-label="Dán ciphertext từ clipboard">
                                    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                                        <rect x="6" y="3" width="11" height="14" rx="1.5" stroke="currentColor"
                                            stroke-width="1.5" />
                                        <path d="M6 5H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-1"
                                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                                    </svg>
                                </button>
                                <button class="icon-btn" id="btn-clear-cipher" title="Xóa nội dung"
                                    aria-label="Xóa ciphertext">
                                    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                                        <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.5"
                                            stroke-linecap="round" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- DECRYPT KEY CONFIG -->
                    <div class="glass-card">
                        <div class="card-header">
                            <div class="card-title-row">
                                <svg class="card-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                                    <path d="M7 10a3 3 0 1 0 6 0 3 3 0 0 0-6 0zm3-3V4m0 12v-3m6-3h-3M7 10H4"
                                        stroke="#00FF41" stroke-width="1.5" stroke-linecap="round" />
                                </svg>
                                <h2 class="card-title">DECRYPTION KEY</h2>
                            </div>
                        </div>
                        <div class="card-body key-body">
                            <div class="key-row">
                                <div class="form-group">
                                    <div class="seg-control" role="group" aria-label="Chọn độ dài khóa AES giải mã">
                                        <button class="seg-btn active" data-keylen="128"
                                            id="dec-seg-128">AES-128</button>
                                        <button class="seg-btn" data-keylen="192" id="dec-seg-192">AES-192</button>
                                        <button class="seg-btn" data-keylen="256" id="dec-seg-256">AES-256</button>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group" style="margin-top:1rem">
                                <div class="label-row">
                                    <label for="dec-key" class="form-label">Secret Key</label>
                                    <button class="text-btn" id="btn-toggle-dec-key" aria-label="Hiện/ẩn key giải mã">
                                        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                            <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor"
                                                stroke-width="1.5" />
                                            <circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.5" />
                                        </svg>
                                        Hiện key
                                    </button>
                                </div>
                                <input type="password" id="dec-key" class="cyber-input"
                                    placeholder="Nhập secret key dùng để encrypt..." autocomplete="off"
                                    spellcheck="false" />
                            </div>
                        </div>
                    </div>
                </div>

                <!-- RIGHT: DECRYPTED OUTPUT -->
                <div class="panel-col">
                    <div class="action-center">
                        <button class="cyber-btn decrypt-btn" id="btn-decrypt" aria-label="Thực hiện giải mã AES">
                            <div class="btn-glow decrypt-glow" aria-hidden="true"></div>
                            <div class="btn-inner">
                                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path d="M12 1a5 5 0 0 1 5 5v3H7V6a5 5 0 0 1 5-5z" stroke="currentColor"
                                        stroke-width="2" stroke-dasharray="4 2" />
                                    <rect x="3" y="9" width="18" height="13" rx="2" stroke="currentColor"
                                        stroke-width="2" />
                                    <path d="M9 15l2 2 4-4" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                                <span class="btn-text">DECRYPT</span>
                                <div class="btn-loader" aria-hidden="true">
                                    <div class="loader-dot"></div>
                                    <div class="loader-dot"></div>
                                    <div class="loader-dot"></div>
                                </div>
                            </div>
                        </button>
                        <div class="arrow-flow" aria-hidden="true">
                            <div class="flow-line"></div>
                            <svg class="flow-arrow" viewBox="0 0 24 24" fill="none">
                                <path d="M5 12h14M13 6l6 6-6 6" stroke="#00FF41" stroke-width="1.5"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </div>
                    </div>

                    <div class="glass-card output-card">
                        <div class="card-header">
                            <div class="card-title-row">
                                <svg class="card-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                                    <path d="M3 5h14M3 10h14M3 15h8" stroke="#00FF41" stroke-width="1.5"
                                        stroke-linecap="round" />
                                </svg>
                                <h2 class="card-title">DECRYPTED TEXT</h2>
                            </div>
                            <button class="icon-btn" id="btn-copy-decrypted" title="Sao chép kết quả"
                                aria-label="Sao chép văn bản sau giải mã" disabled>
                                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                                    <rect x="6" y="3" width="11" height="14" rx="1.5" stroke="currentColor"
                                        stroke-width="1.5" />
                                    <path d="M6 5H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-1"
                                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                                </svg>
                            </button>
                        </div>
                        <div class="card-body">
                            <div class="output-display" id="decrypted-output" aria-live="polite"
                                aria-label="Kết quả giải mã">
                                <div class="output-placeholder">
                                    <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
                                        <path d="M10 14h28M10 20h20M10 26h24M10 32h16" stroke="#00FF41"
                                            stroke-width="1.5" stroke-linecap="round" opacity="0.3" />
                                    </svg>
                                    <p>Văn bản giải mã sẽ hiển thị tại đây</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- DECRYPT METRICS -->
                    <div class="glass-card metrics-card">
                        <div class="card-body metrics-body">
                            <div class="metric-item">
                                <span class="metric-label">Thời gian xử lý</span>
                                <span class="metric-val" id="dec-metric-time">— ns</span>
                            </div>
                            <div class="metric-item">
                                <span class="metric-label">Số khối đã giải mã</span>
                                <span class="metric-val" id="dec-metric-blocks">—</span>
                            </div>
                            <div class="metric-item">
                                <span class="metric-label">Kết quả</span>
                                <span class="metric-val" id="dec-metric-status">—</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
