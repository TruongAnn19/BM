<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="AES Cipher Tool - Công cụ mã hóa và giải mã AES 128/192/256 bit trực tuyến, giao diện cyberpunk" />
    <title>AES Cipher Tool | Mã hóa & Giải mã</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet" />

</head>

<body>
    <!-- Scanline overlay -->
    <div class="scanlines" aria-hidden="true"></div>
    <!-- Particle canvas -->
    <canvas id="particleCanvas" aria-hidden="true"></canvas>

    <!-- ===== HEADER ===== -->
    <header class="site-header" role="banner">
        <div class="header-inner">
            <div class="logo" aria-label="AES Cipher Tool">
                <svg class="logo-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                    <rect x="2" y="8" width="28" height="18" rx="2" stroke="#00FF41" stroke-width="1.5" />
                    <path d="M10 14h12M10 18h8" stroke="#00FF41" stroke-width="1.5" stroke-linecap="round" />
                    <path d="M16 2v6M13 2h6" stroke="#00FF41" stroke-width="1.5" stroke-linecap="round" />
                    <circle cx="24" cy="17" r="3" stroke="#00FF41" stroke-width="1.5" />
                    <path d="M24 15.5v1.5l.8.8" stroke="#00FF41" stroke-width="1" stroke-linecap="round" />
                </svg>
                <span class="logo-text">AES<span class="logo-accent">_CIPHER</span></span>
            </div>
            <nav class="header-nav" aria-label="Điều hướng chính">
                <button class="nav-btn active" id="nav-encrypt" aria-pressed="true">
                    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                        <path d="M10 2a4 4 0 0 1 4 4v2H6V6a4 4 0 0 1 4-4z" stroke="currentColor" stroke-width="1.5" />
                        <rect x="3" y="8" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5" />
                        <circle cx="10" cy="13" r="1.5" fill="currentColor" />
                    </svg>
                    Mã hóa
                </button>
                <button class="nav-btn" id="nav-decrypt" aria-pressed="false">
                    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                        <path d="M10 2a4 4 0 0 1 4 4v2H6V6a4 4 0 0 1 4-4z" stroke="currentColor" stroke-width="1.5"
                            stroke-dasharray="3 2" />
                        <rect x="3" y="8" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5" />
                        <path d="M8 13l2 2 2-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                    Giải mã
                </button>
                <button class="nav-btn" id="nav-file" aria-pressed="false">
                    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                        <path d="M4 4a2 2 0 0 1 2-2h5l5 5v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4z" stroke="currentColor"
                            stroke-width="1.5" />
                        <path d="M11 2v5h5" stroke="currentColor" stroke-width="1.5" />
                        <path d="M8 13h4M10 11v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                    Mã hóa File
                </button>
                <button class="nav-btn" id="nav-decrypt-file" aria-pressed="false">
                    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                        <path d="M4 4a2 2 0 0 1 2-2h5l5 5v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4z" stroke="currentColor"
                            stroke-width="1.5" stroke-dasharray="3 2" />
                        <path d="M11 2v5h5" stroke="currentColor" stroke-width="1.5" />
                        <path d="M7 13l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    Giải mã File
                </button>
                <button class="nav-btn" id="nav-about" aria-pressed="false">
                    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                        <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5" />
                        <path d="M10 9v5M10 7v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                    Về thuật toán
                </button>
            </nav>
            <div class="header-status" aria-live="polite">
                <span class="status-dot" aria-hidden="true"></span>
                <span class="status-text">SYSTEM READY</span>
            </div>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content" id="main">

        <!-- === TAB: ENCRYPT === -->
        <section class="tab-panel active" id="panel-encrypt" role="tabpanel" aria-labelledby="nav-encrypt"></section>

        <!-- === TAB: DECRYPT === -->
        <section class="tab-panel" id="panel-decrypt" role="tabpanel" aria-labelledby="nav-decrypt"></section>

        <!-- === TAB: ENCRYPT FILE === -->
        <section class="tab-panel" id="panel-file" role="tabpanel" aria-labelledby="nav-file"></section>

        <!-- === TAB: DECRYPT FILE === -->
        <section class="tab-panel" id="panel-decrypt-file" role="tabpanel" aria-labelledby="nav-decrypt-file"></section>

        <!-- === TAB: ABOUT === -->
        <section class="tab-panel" id="panel-about" role="tabpanel" aria-labelledby="nav-about"></section>

    </main>

    <!-- TOAST NOTIFICATION -->
    <div class="toast" id="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

    <!-- FOOTER -->
    <footer class="site-footer" role="contentinfo">
        <div class="footer-inner">
            <p class="footer-text">
                AES implementation based on FIPS PUB 197 &mdash; ECB mode &mdash; Educational purpose only
            </p>
            <p class="footer-text">
                Galois Field GF(2⁸) &bull; Irreducible polynomial: x⁸ + x⁴ + x³ + x + 1 &bull; 2026
            </p>
        </div>
    </footer>

    <!-- app.js calls server.js (Node.js) which spawns aes.exe compiled from main.cpp -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
